name: Auto Update IPTV Gather Playlist and EPG

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

# 赋予自动推送和发布 Release 的写入权限
permissions:
  contents: write

jobs:
  update-iptv:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 执行筛选、测速与 EPG 合成脚本
        run: python scripts/filter_epg.py

      - name: 提交并推送 m3u 文件到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Gather.m3u
          git commit -m "chore: auto update Gather.m3u [skip ci]" || echo "没有检测到 M3U 更新"
          git push

      - name: 将大体积 EPG 文件发布到 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: epg
          name: "Latest EPG Data"
          body: "自动更新的最新 EPG 节目单文件"
          files: Gather_epg.xml.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
