name: Auto Update IPTV Gather Playlist and EPG

on:
  schedule:
    # 每天 UTC 20:00 (北京时间凌晨 04:00) 自动执行
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-iptv:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 执行筛选与 EPG 合成脚本
        run: |
          cat << 'EOF' > filter_runner.py
          import json, re, requests, gzip, time, io
          from datetime import datetime
          import xml.etree.ElementTree as ET


          def clean_str(s):
              return re.sub(r'[^a-zA-Z0-9\u4e00-\u9fa5]', '', s).lower()


          def fetch_m3u(url):
              """拉取 m3u，提取 tvg-id / tvg-name / tvg-logo / 标题"""
              channels = []
              try:
                  resp = requests.get(url, timeout=15, headers={'User-Agent': 'Mozilla/5.0'})
                  if resp.status_code == 200:
                      lines = resp.text.splitlines()
                      current_title = ""
                      current_logo = ""
                      current_tvg_id = ""
                      current_tvg_name = ""
                      for line in lines:
                          line = line.strip()
                          if line.startswith("#EXTINF:"):
                              parts = line.split(",")
                              current_title = parts[-1].strip() if len(parts) > 1 else ""

                              logo_match = re.search(r'tvg-logo="([^"]*)"', line)
                              current_logo = logo_match.group(1) if logo_match else ""

                              id_match = re.search(r'tvg-id="([^"]*)"', line)
                              current_tvg_id = id_match.group(1) if id_match else ""

                              name_match = re.search(r'tvg-name="([^"]*)"', line)
                              current_tvg_name = name_match.group(1) if name_match else ""

                          elif line and not line.startswith("#") and current_title:
                              channels.append((current_title, line, current_logo,
                                               current_tvg_id, current_tvg_name))
                              current_title = ""
                              current_logo = ""
                              current_tvg_id = ""
                              current_tvg_name = ""
                      print(f"✅ 从 [{url}] 成功拉取到 {len(channels)} 条原始线路")
              except Exception as e:
                  print(f"❌ 拉取 [{url}] 失败: {e}")
              return channels


          def extract_from_gz(gz_url, match_list, t_name, headers):
              """
              下载 gz 包，内存解压，按 match_list 匹配 <channel>，
              返回 (channels_elems, programmes_elems)，并把 id 改成 t_name
              """
              try:
                  resp = requests.get(gz_url, timeout=60, headers=headers)
                  if resp.status_code != 200:
                      print(f"  └─ ❌ gz 下载失败 [{gz_url}] HTTP {resp.status_code}")
                      return [], []

                  # 内存解压
                  try:
                      xml_bytes = gzip.decompress(resp.content)
                  except Exception as e:
                      print(f"  └─ ❌ gz 解压失败 [{gz_url}]: {e}")
                      return [], []

                  sub_tree = ET.fromstring(xml_bytes)

                  # 先找出匹配的 channel id
                  matched_ids = set()
                  matched_channels = []
                  for ch in sub_tree.findall('channel'):
                      ch_id = ch.get('id', '')
                      display_names = [d.text or '' for d in ch.findall('display-name')]
                      candidates = [ch_id] + display_names
                      clean_candidates = [clean_str(c) for c in candidates]

                      hit = False
                      for m in match_list:
                          cm = clean_str(m)
                          if cm in clean_candidates:
                              hit = True
                              break
                      if hit:
                          matched_ids.add(ch_id)
                          # 改 id 和 display-name 为统一 t_name
                          ch.set('id', t_name)
                          for d in ch.findall('display-name'):
                              d.text = t_name
                          matched_channels.append(ch)

                  if not matched_ids:
                      print(f"  └─ ⚠️ gz 包中未找到匹配频道 [{t_name}]，匹配词: {match_list}")
                      return [], []

                  # 再提取对应 programme
                  matched_programmes = []
                  for prog in sub_tree.findall('programme'):
                      if prog.get('channel') in matched_ids:
                          prog.set('channel', t_name)
                          matched_programmes.append(prog)

                  print(f"  └─ ✅ gz 包中匹配到 [{t_name}]："
                        f"{len(matched_channels)} 个 channel，{len(matched_programmes)} 条 programme")
                  return matched_channels, matched_programmes

              except Exception as e:
                  print(f"  └─ ❌ gz 处理异常 [{gz_url}]: {e}")
                  return [], []


          # 1. 加载配置
          with open('config/config.json', 'r', encoding='utf-8') as f:
              config = json.load(f)

          # 2. 获取所有上游源，并建立 url -> 频道列表 的缓存
          source_cache = {}
          upstream_urls = config.get('upstream_urls', [])
          for upstream in upstream_urls:
              source_cache[upstream] = fetch_m3u(upstream)

          total = sum(len(v) for v in source_cache.values())
          print(f"\n📡 上游合并完成，总计 {total} 条线路，开始按 tvg-id / tvg-name 精准匹配...\n")

          # 3. 精准匹配 tvg-id 或 tvg-name，直接取前 2 条
          final_items = []
          for target in config.get('keep_channels', []):
              t_name = target.get('name')
              t_group = target.get('group', 'NEWS')
              keywords = target.get('keywords', [])
              source_field = target.get('source')

              if source_field:
                  if isinstance(source_field, str):
                      target_sources = [source_field]
                  else:
                      target_sources = list(source_field)
              else:
                  target_sources = upstream_urls

              candidate_channels = []
              for src in target_sources:
                  if src in source_cache:
                      candidate_channels.extend(source_cache[src])
                  else:
                      print(f"⚠️ [{t_name}] 指定的 source 不在 upstream_urls 中，已跳过: {src}")

              matched_urls = []
              matched_logos = []
              for raw_title, raw_url, raw_logo, raw_tvg_id, raw_tvg_name in candidate_channels:
                  clean_id = clean_str(raw_tvg_id)
                  clean_name = clean_str(raw_tvg_name)
                  for kw in keywords:
                      clean_kw = clean_str(kw)
                      if clean_kw == clean_id or clean_kw == clean_name:
                          matched_urls.append(raw_url)
                          matched_logos.append(raw_logo)
                          break

              unique_urls = list(dict.fromkeys(matched_urls))
              selected_urls = unique_urls[:2]

              if selected_urls:
                  url_logo_map = dict(zip(matched_urls, matched_logos))
                  print(f"🎯 [{t_name}] 精准匹配到 {len(unique_urls)} 条，直接选取前 {len(selected_urls)} 条")
                  for idx, url in enumerate(selected_urls, 1):
                      logo = url_logo_map.get(url, "")
                      logo_attr = f' tvg-logo="{logo}"' if logo else ''
                      final_items.append(
                          f'#EXTINF:-1 tvg-id="{t_name}" tvg-name="{t_name}"'
                          f'{logo_attr} group-title="{t_group}",{t_name}\n{url}'
                      )
              else:
                  print(f"⚠️ [{t_name}] 未匹配到 tvg-id / tvg-name")

          # 4. 写入 Gather.m3u
          with open('Gather.m3u', 'w', encoding='utf-8') as f:
              f.write("#EXTM3U\n" + "\n".join(final_items))
          print(f"\n🎉 Gather.m3u 生成成功！共 {len(final_items)} 条线路（未测速，无线路N后缀）。")

          # 5. 拼接 EPG XML 数据
          today_str = datetime.now().strftime("%Y%m%d")
          root_epg = ET.Element("tv")
          print("\n📺 开始拼接并修正 EPG 数据...")
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 '
                            '(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          }

          for target in config.get('keep_channels', []):
              t_name = target.get('name')
              xml_url = target.get('xml_url')
              xml_gz = target.get('xml_gz')
              xml_gz_match = target.get('xml_gz_match') or [t_name]

              # 5.1 普通 xml_url 逻辑（保持原样）
              if xml_url:
                  xml_url_fixed = re.sub(r'date=\d{8}', f'date={today_str}', xml_url)
                  success = False
                  for attempt in range(1, 4):
                      try:
                          resp = requests.get(xml_url_fixed, timeout=20, headers=headers)
                          if resp.status_code == 200:
                              sub_tree = ET.fromstring(resp.content)
                              for elem in sub_tree:
                                  if elem.tag == 'channel':
                                      elem.set('id', t_name)
                                      for d_name in elem.findall('display-name'):
                                          d_name.text = t_name
                                  elif elem.tag == 'programme':
                                      elem.set('channel', t_name)
                                  root_epg.append(elem)
                              print(f"  └─ ✅ 拼接与对齐 EPG [{t_name}] (xml_url)")
                              success = True
                              break
                      except Exception as e:
                          if attempt < 3:
                              time.sleep(1.5)
                  if not success:
                      print(f"  └─ ❌ 拼接 EPG [{t_name}] 失败 (xml_url): 连续重试3次均超时或连接失败")

              # 5.2 gz 压缩包逻辑
              if xml_gz:
                  chs, progs = extract_from_gz(xml_gz, xml_gz_match, t_name, headers)
                  for ch in chs:
                      root_epg.append(ch)
                  for p in progs:
                      root_epg.append(p)

          # 6. 生成并保存 EPG 文件到当前根目录
          xml_data = ET.tostring(root_epg, encoding='utf-8', xml_declaration=True)

          with open("Gather_epg.xml", "wb") as f:
              f.write(xml_data)
          print("\n📄 Gather_epg.xml 生成完成！")

          with gzip.open("Gather_epg.xml.gz", "wb") as f:
              f.write(xml_data)
          print("📦 Gather_epg.xml.gz 打包完成！")
          EOF
          python filter_runner.py
          rm -f filter_runner.py

      - name: 提交并推送 M3U 和 EPG 文件到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Gather.m3u Gather_epg.xml Gather_epg.xml.gz
          git commit -m "chore: auto update playlist and epg [skip ci]" || echo "没有检测到更新"
          git push origin HEAD:${{ github.ref_name }} --force
