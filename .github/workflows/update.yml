name: Auto Update My IPTV List

on:
  schedule:
    # 每天 UTC 时间 20:00 (北京时间早晨 4:00) 自动触发
    - cron: '0 20 * * *'
  workflow_dispatch: # 支持在 GitHub 网页手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-python-version: '3.x'

      - name: 执行筛选脚本
        run: python filter_epg.py

      - name: 提交更新回 GitHub 仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add my_list.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update playlist" && git push)
