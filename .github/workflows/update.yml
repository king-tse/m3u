import json, re, requests, gzip, time
from datetime import datetime
import xml.etree.ElementTree as ET
from concurrent.futures import ThreadPoolExecutor, as_completed


def clean_str(s):
    return re.sub(r'[^a-zA-Z0-9\u4e00-\u9fa5]', '', s).lower()


def fetch_m3u(url):
    """拉取 m3u，保留 标题 / URL / tvg-logo"""
    channels = []
    try:
        resp = requests.get(url, timeout=15, headers={'User-Agent': 'Mozilla/5.0'})
        if resp.status_code == 200:
            lines = resp.text.splitlines()
            current_title = ""
            current_logo = ""
            for line in lines:
                line = line.strip()
                if line.startswith("#EXTINF:"):
                    parts = line.split(",")
                    current_title = parts[-1].strip() if len(parts) > 1 else ""
                    logo_match = re.search(r'tvg-logo="([^"]*)"', line)
                    current_logo = logo_match.group(1) if logo_match else ""
                elif line and not line.startswith("#") and current_title:
                    channels.append((current_title, line, current_logo))
                    current_title = ""
                    current_logo = ""
            print(f"✅ 从 [{url}] 成功拉取到 {len(channels)} 条原始线路")
    except Exception as e:
        print(f"❌ 拉取 [{url}] 失败: {e}")
    return channels


def test_url(url):
    """验证线路可用性，限时 3 秒"""
    try:
        resp = requests.head(url, timeout=3, allow_redirects=True,
                             headers={'User-Agent': 'VLC/3.0.18'})
        if resp.status_code in [200, 206, 301, 302]:
            return url
        resp = requests.get(url, timeout=3, stream=True,
                            headers={'User-Agent': 'VLC/3.0.18'})
        if resp.status_code in [200, 206, 301, 302]:
            return url
    except Exception:
        pass
    return None


def filter_and_test_urls(urls, max_keep=2):
    """多线程并发测试线路，只保留前 max_keep 条可用线路"""
    valid_urls = []
    unique_urls = list(dict.fromkeys(urls))

    with ThreadPoolExecutor(max_workers=15) as executor:
        future_to_url = {executor.submit(test_url, url): url for url in unique_urls}
        for future in as_completed(future_to_url):
            res = future.result()
            if res:
                valid_urls.append(res)
                if len(valid_urls) >= max_keep:
                    executor.shutdown(wait=False, cancel_futures=True)
                    break
    return valid_urls


# 1. 加载配置
with open('config/config.json', 'r', encoding='utf-8') as f:
    config = json.load(f)

# 2. 获取所有原始线路
all_raw = []
for upstream in config.get('upstream_urls', []):
    all_raw.extend(fetch_m3u(upstream))

print(f"\n📡 上游合并完成，总计 {len(all_raw)} 条线路，开始频道筛选与测速...\n")

# 3. 匹配并测速筛选
final_items = []
for target in config.get('keep_channels', []):
    t_name = target.get('name')
    t_group = target.get('group', 'NEWS')
    keywords = target.get('keywords', [])

    matched_urls = []
    matched_logos = []
    for raw_title, raw_url, raw_logo in all_raw:
        clean_t = clean_str(raw_title)
        for kw in keywords:
            if clean_str(kw) in clean_t:
                matched_urls.append(raw_url)
                matched_logos.append(raw_logo)
                break

    if matched_urls:
        # 建立 url -> logo 映射，测速后仍能取到对应 logo
        url_logo_map = dict(zip(matched_urls, matched_logos))
        valid_urls = filter_and_test_urls(matched_urls, max_keep=2)
        if valid_urls:
            print(f"🎯 [{t_name}] 匹配到 {len(matched_urls)} 条，测速通过 {len(valid_urls)} 条有效线路")
            for idx, url in enumerate(valid_urls, 1):
                logo = url_logo_map.get(url, "")
                logo_attr = f' tvg-logo="{logo}"' if logo else ''
                final_items.append(
                    f'#EXTINF:-1 tvg-id="{t_name}" tvg-name="{t_name}"'
                    f'{logo_attr} group-title="{t_group}",{t_name} (线路{idx})\n{url}'
                )
        else:
            print(f"❌ [{t_name}] 匹配到 {len(matched_urls)} 条，但测速后均不可用")
    else:
        print(f"⚠️ [{t_name}] 未匹配到线路")

# 4. 写入 Gather.m3u
with open('Gather.m3u', 'w', encoding='utf-8') as f:
    f.write("#EXTM3U\n" + "\n".join(final_items))
print(f"\n🎉 Gather.m3u 生成成功！共 {len(final_items)} 条高可用线路。")

# 5. 拼接 EPG XML 数据
today_str = datetime.now().strftime("%Y%m%d")
root_epg = ET.Element("tv")
print("\n📺 开始拼接并修正 EPG 数据...")
headers = {
    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 '
                  '(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
}

for target in config.get('keep_channels', []):
    t_name = target.get('name')
    xml_url = target.get('xml_url')
    if not xml_url:
        continue
    xml_url = re.sub(r'date=\d{8}', f'date={today_str}', xml_url)

    success = False
    for attempt in range(1, 4):
        try:
            resp = requests.get(xml_url, timeout=20, headers=headers)
            if resp.status_code == 200:
                sub_tree = ET.fromstring(resp.content)
                for elem in sub_tree:
                    if elem.tag == 'channel':
                        elem.set('id', t_name)
                        for d_name in elem.findall('display-name'):
                            d_name.text = t_name
                    elif elem.tag == 'programme':
                        elem.set('channel', t_name)
                    root_epg.append(elem)
                print(f"  └─ ✅ 拼接与对齐 EPG [{t_name}]")
                success = True
                break
        except Exception as e:
            if attempt < 3:
                time.sleep(1.5)

    if not success:
        print(f"  └─ ❌ 拼接 EPG [{t_name}] 失败: 连续重试3次均超时或连接失败")

# 6. 生成并保存 EPG 文件到当前根目录
xml_data = ET.tostring(root_epg, encoding='utf-8', xml_declaration=True)

with open("Gather_epg.xml", "wb") as f:
    f.write(xml_data)
print("\n📄 Gather_epg.xml 生成完成！")

with gzip.open("Gather_epg.xml.gz", "wb") as f:
    f.write(xml_data)
print("📦 Gather_epg.xml.gz 打包完成！")
