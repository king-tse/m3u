name: Auto Update IPTV Gather Playlist and EPG

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-iptv:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 排查脚本文件位置
        run: |
          echo "=== 当前工作目录 ==="
          pwd
          echo "=== 根目录文件列表 ==="
          ls -la
          echo "=== scripts 目录文件列表 ==="
          ls -la scripts/

      - name: 执行筛选、测速与 EPG 合成脚本
        run: python scripts/filter_epg.py

      - name: 提交并推送更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Gather.m3u Gather_epg.xml.gz
          git commit -m "chore: auto update Gather.m3u and Gather_epg.xml.gz [skip ci]" || echo "没有检测到更新"
          git push
