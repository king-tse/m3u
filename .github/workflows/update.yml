name: Auto Update IPTV Gather Playlist

on:
  schedule:
    # 每天 UTC 20:00 (北京时间凌晨 04:00) 自动触发运行
    - cron: '0 20 * * *'
  workflow_dispatch: # 允许你在 GitHub 页面 manually 手动点击“Run workflow”执行

jobs:
  update-iptv:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v3

      - name: 配置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖库
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 执行自动化测速与生成脚本
        run: python scripts/filter_epg.py

      - name: 提交并推送 Gather.m3u 到根目录
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Gather.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto update Gather.m3u [skip ci]" && git push)
