name: Auto Update IPTV Gather Playlist and EPG

on:
  schedule:
    # 每天 UTC 20:00 (北京时间凌晨 04:00) 自动执行
    - cron: '0 20 * * *'
  workflow_dispatch: # 允许在 GitHub 网页界面手动点击触发

jobs:
  update-iptv:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v3

      - name: 配置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 执行筛选、测速与 EPG 合成脚本
        run: python scripts/filter_epg.py

      - name: 提交并推送更新到仓库根目录
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Gather.m3u Gather_epg.xml.gz
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto update Gather.m3u and Gather_epg.xml.gz [skip ci]" && git push)
