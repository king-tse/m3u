<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>IPTV 源批量测速器（含分辨率）</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 12px 16px; background: #f5f6f8; color: #222;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  h1 { font-size: 18px; margin: 0 0 10px; flex: 0 0 auto; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  input[type=text] {
    flex: 1; min-width: 240px; padding: 8px 10px; border: 1px solid #ccc;
    border-radius: 6px; font-size: 14px;
  }
  input[type=number] {
    padding: 4px 6px; border: 1px solid #ccc; border-radius: 6px;
  }
  button {
    padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer;
    background: #2563eb; color: #fff; font-size: 14px;
  }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
  button.secondary { background: #64748b; }
  button.ghost { background: #e2e8f0; color: #334155; }

  /* 固定区：播放器 + 源加载面板 */
  .fixed-area { flex: 0 0 auto; }

  .panel {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
    padding: 12px; margin-bottom: 10px;
  }
  #player { width: 100%; height: 300px; background: #000; border-radius: 6px; }
  .now { font-size: 13px; color: #475569; margin-top: 6px; }

  .stats { font-size: 13px; color: #475569; margin-bottom: 8px; }
  .stats b { color: #0f172a; }

  /* 滚动区：只滚动下面列表 */
  .table-wrap {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; overflow-x: hidden;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td {
    border-bottom: 1px solid #eef2f7; padding: 6px 8px; text-align: left;
    vertical-align: middle; word-break: break-all;
  }
  th {
    background: #f1f5f9; position: sticky; top: 0; z-index: 2;
  }
  tr:hover td { background: #f8fafc; }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 12px; white-space: nowrap;
  }
  .ok   { background: #dcfce7; color: #166534; }
  .slow { background: #fef9c3; color: #854d0e; }
  .bad  { background: #fee2e2; color: #991b1b; }
  .wait { background: #e2e8f0; color: #475569; }
  .res  { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<h1>📺 IPTV 源批量测速器（含分辨率）</h1>

<!-- ======== 固定区（不滚动） ======== -->
<div class="fixed-area">

  <!-- 播放器 -->
  <div class="panel">
    <div class="bar">
      <input type="text" id="playInput" placeholder="输入频道名（例如 CCTV1 / BBC）或直接粘贴视频 URL，回车播放" />
      <button id="playBtn">▶ 播放</button>
      <button id="stopBtn" class="ghost">■ 停止</button>
    </div>
    <video id="player" controls playsinline></video>
    <div class="now" id="nowPlaying">当前未播放</div>
  </div>

  <!-- 源加载 -->
  <div class="panel">
    <div class="bar">
      <input type="text" id="urlInput" placeholder="输入 M3U 源地址，例如 https://iptv-org.github.io/iptv/index.m3u" />
      <button id="loadBtn">📥 加载频道</button>
      <button id="testBtn" class="secondary" disabled>⚡ 开始测速</button>
      <button id="exportBtn" class="ghost" disabled>💾 导出可用列表</button>
    </div>
    <div class="bar">
      <input type="text" id="filterInput" placeholder="🔍 过滤频道（名称 / tvg-id / 分组）" />
      <label style="font-size:13px;color:#475569;display:flex;align-items:center;gap:4px;">
        并发数 <input type="number" id="concurrency" value="20" min="1" max="100" style="width:60px;" />
      </label>
      <label style="font-size:13px;color:#475569;display:flex;align-items:center;gap:4px;">
        超时(秒) <input type="number" id="timeout" value="6" min="1" max="30" style="width:60px;" />
      </label>
      <label style="font-size:13px;color:#475569;display:flex;align-items:center;gap:4px;">
        <input type="checkbox" id="detectRes" checked /> 检测分辨率
      </label>
    </div>
    <div class="stats" id="stats">尚未加载频道</div>
  </div>

</div>

<!-- ======== 滚动区（只滚动列表） ======== -->
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th style="width:60px;">操作</th>
        <th>频道名</th>
        <th style="width:130px;">tvg-id</th>
        <th style="width:130px;">tvg-name</th>
        <th style="width:100px;">group-title</th>
        <th>URL</th>
        <th style="width:100px;">分辨率</th>
        <th style="width:110px;">质量</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
// ========== 全局状态 ==========
let channels = [];
let testing = false;

const $ = id => document.getElementById(id);
const player = $('player');

// ========== CORS 代理 ==========
const CORS_PROXIES = [
  u => u,
  u => 'https://corsproxy.io/?' + encodeURIComponent(u),
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
];

async function fetchText(url) {
  let lastErr;
  for (const wrap of CORS_PROXIES) {
    try {
      const resp = await fetch(wrap(url), { redirect: 'follow' });
      if (resp.ok) return await resp.text();
      lastErr = new Error('HTTP ' + resp.status);
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('所有代理均失败');
}

// ========== 解析 M3U ==========
function parseM3U(text) {
  const lines = text.split(/\r?\n/);
  const out = [];
  let cur = null;
  for (let raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('#EXTINF')) {
      const name = (line.split(',').pop() || '').trim();
      const get = key => {
        const m = line.match(new RegExp(key + '="([^"]*)"', 'i'));
        return m ? m[1] : '';
      };
      cur = {
        name,
        tvgId:   get('tvg-id'),
        tvgName: get('tvg-name'),
        logo:    get('tvg-logo'),
        group:   get('group-title'),
        url: '',
        status: 'wait',
        delay: null,
        resolution: '',
      };
    } else if (line.startsWith('#')) {
      continue;
    } else if (cur) {
      cur.url = line;
      out.push(cur);
      cur = null;
    }
  }
  return out;
}

// ========== 加载频道 ==========
$('loadBtn').onclick = async () => {
  const url = $('urlInput').value.trim();
  if (!url) return alert('请输入 M3U 源地址');
  $('loadBtn').disabled = true;
  $('loadBtn').textContent = '加载中...';
  try {
    const text = await fetchText(url);
    channels = parseM3U(text);
    render();
    $('testBtn').disabled = channels.length === 0;
    $('exportBtn').disabled = channels.length === 0;
    setStats();
  } catch (e) {
    alert('加载失败：' + e.message);
  } finally {
    $('loadBtn').disabled = false;
    $('loadBtn').textContent = '📥 加载频道';
  }
};

// ========== 渲染 ==========
function render() {
  const kw = $('filterInput').value.trim().toLowerCase();
  const tbody = $('tbody');
  tbody.innerHTML = '';
  const frag = document.createDocumentFragment();

  channels.forEach((ch, i) => {
    if (kw) {
      const hay = (ch.name + ' ' + ch.tvgId + ' ' + ch.tvgName + ' ' + ch.group).toLowerCase();
      if (!hay.includes(kw)) return;
    }
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><button class="ghost" data-i="${i}">▶</button></td>
      <td>${esc(ch.name)}</td>
      <td>${esc(ch.tvgId)}</td>
      <td>${esc(ch.tvgName)}</td>
      <td>${esc(ch.group)}</td>
      <td>${esc(ch.url)}</td>
      <td class="res">${esc(ch.resolution) || '-'}</td>
      <td>${statusBadge(ch)}</td>
    `;
    frag.appendChild(tr);
  });
  tbody.appendChild(frag);

  tbody.querySelectorAll('button[data-i]').forEach(btn => {
    btn.onclick = () => {
      const ch = channels[+btn.dataset.i];
      playUrl(ch.url, ch.name);
    };
  });
}

function statusBadge(ch) {
  if (ch.status === 'wait')    return '<span class="badge wait">待测</span>';
  if (ch.status === 'testing') return '<span class="badge wait">测试中…</span>';
  if (ch.status === 'ok')      return `<span class="badge ok">✅ ${ch.delay} ms</span>`;
  if (ch.status === 'slow')    return `<span class="badge slow">⚠️ ${ch.delay} ms</span>`;
  return '<span class="badge bad">❌ 失败</span>';
}

function esc(s) {
  return (s || '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

$('filterInput').oninput = render;

function setStats(extra = '') {
  const total = channels.length;
  const ok = channels.filter(c => c.status === 'ok' || c.status === 'slow').length;
  const bad = channels.filter(c => c.status === 'bad').length;
  const wait = channels.filter(c => c.status === 'wait' || c.status === 'testing').length;
  $('stats').innerHTML = `共 <b>${total}</b> 条 · 可用 <b>${ok}</b> · 失败 <b>${bad}</b> · 待测 <b>${wait}</b> ${extra}`;
}

// ========== 并发测速 ==========
$('testBtn').onclick = async () => {
  if (testing) return;
  testing = true;
  $('testBtn').disabled = true;
  const conc = Math.max(1, Math.min(100, +$('concurrency').value || 20));
  const timeoutMs = Math.max(1, +$('timeout').value || 6) * 1000;
  const doRes = $('detectRes').checked;

  channels.forEach(c => { c.status = 'wait'; c.delay = null; c.resolution = ''; });
  render(); setStats();

  let idx = 0;
  const total = channels.length;
  let done = 0;
  let renderPending = false;

  function scheduleRender() {
    if (renderPending) return;
    renderPending = true;
    requestAnimationFrame(() => {
      renderPending = false;
      render(); setStats(`（已测 ${done}/${total}）`);
    });
  }

  async function worker() {
    while (testing && idx < total) {
      const i = idx++;
      const ch = channels[i];
      ch.status = 'testing';
      scheduleRender();

      const res = await testUrl(ch.url, timeoutMs);
      if (res.ok) {
        ch.status = res.delay < 800 ? 'ok' : 'slow';
        ch.delay = res.delay;
        if (doRes) {
          const r = await detectResolution(ch.url, timeoutMs);
          if (r) ch.resolution = r;
        }
      } else {
        ch.status = 'bad';
        ch.delay = null;
      }
      done++;
      scheduleRender();
    }
  }

  await Promise.all(Array.from({ length: conc }, worker));
  testing = false;
  $('testBtn').disabled = false;
  render(); setStats();
};

// ========== 探测可用性 ==========
async function testUrl(url, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  const start = performance.now();
  try {
    let resp = await fetch(url, { method: 'HEAD', signal: ctrl.signal, redirect: 'follow' });
    if (!resp.ok) {
      resp = await fetch(url, {
        method: 'GET', signal: ctrl.signal, redirect: 'follow',
        headers: { 'Range': 'bytes=0-0' }
      });
    }
    clearTimeout(timer);
    const delay = Math.round(performance.now() - start);
    if (resp.ok || resp.status === 206) return { ok: true, delay };
    return { ok: false, delay };
  } catch (e) {
    clearTimeout(timer);
    return { ok: false, delay: null };
  }
}

// ========== 探测分辨率 ==========
function detectResolution(url, timeoutMs) {
  return new Promise(resolve => {
    const v = document.createElement('video');
    v.muted = true;
    v.preload = 'metadata';
    v.crossOrigin = 'anonymous';
    v.style.position = 'fixed';
    v.style.left = '-9999px';
    document.body.appendChild(v);

    let settled = false;
    const finish = (result) => {
      if (settled) return;
      settled = true;
      try { v.removeAttribute('src'); v.load(); } catch (_) {}
      v.remove();
      resolve(result);
    };

    const timer = setTimeout(() => finish(null), timeoutMs + 3000);

    v.addEventListener('loadedmetadata', () => {
      clearTimeout(timer);
      const w = v.videoWidth, h = v.videoHeight;
      if (!w || !h) return finish(null);
      finish(`${w}×${h}`);
    });
    v.addEventListener('error', () => { clearTimeout(timer); finish(null); });

    if (/\.m3u8($|\?)/i.test(url)) {
      if (window.Hls && Hls.isSupported()) {
        const hls = new Hls({ maxBufferLength: 5 });
        hls.on(Hls.Events.ERROR, (e, data) => {
          if (data.fatal) { try { hls.destroy(); } catch (_) {} finish(null); }
        });
        hls.loadSource(url);
        hls.attachMedia(v);
        v._hls = hls;
      } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
        v.src = url;
      } else {
        finish(null);
      }
    } else {
      v.src = url;
    }
  });
}

// ========== 导出 ==========
$('exportBtn').onclick = () => {
  const alive = channels.filter(c => c.status === 'ok' || c.status === 'slow');
  if (!alive.length) return alert('没有可用频道，请先测速');
  const lines = ['#EXTM3U'];
  alive.forEach(c => {
    const logo = c.logo ? ` tvg-logo="${c.logo}"` : '';
    const res  = c.resolution ? ` resolution="${c.resolution}"` : '';
    lines.push(`#EXTINF:-1 tvg-id="${c.tvgId}" tvg-name="${c.tvgName}"${logo}${res} group-title="${c.group}",${c.name}`);
    lines.push(c.url);
  });
  const blob = new Blob([lines.join('\n')], { type: 'audio/x-mpegurl' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'working.m3u';
  a.click();
};

// ========== 播放器 ==========
$('playBtn').onclick = () => {
  const v = $('playInput').value.trim();
  if (!v) return;
  if (/^https?:\/\//i.test(v)) return playUrl(v, v);
  const kw = v.toLowerCase();
  const hit = channels.find(c => (c.name || '').toLowerCase().includes(kw));
  if (!hit) return alert('未找到匹配频道：' + v);
  playUrl(hit.url, hit.name);
};
$('playInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('playBtn').click(); });

function playUrl(url, name) {
  if (window.Hls && Hls.isSupported() && /\.m3u8($|\?)/i.test(url)) {
    if (player._hls) player._hls.destroy();
    const hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(player);
    player._hls = hls;
  } else {
    player.src = url;
  }
  $('nowPlaying').textContent = '▶ 正在播放：' + name + '  —  ' + url;
  player.play().catch(() => {});
}

$('stopBtn').onclick = () => {
  try { if (player._hls) { player._hls.destroy(); player._hls = null; } } catch (_) {}
  player.pause();
  player.removeAttribute('src');
  player.load();
  $('nowPlaying').textContent = '当前未播放';
};
</script>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
</body>
</html>
